spring.application.name=activity-service

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/activity_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:new_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
course.service.base-url=${COURSE_SERVICE_URL:http://localhost:8082}
learning-resource.service.base-url=${LEARNING_RESOURCE_SERVICE_URL:http://localhost:8085}

# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
app.cache.activity.ttl-seconds=86400

