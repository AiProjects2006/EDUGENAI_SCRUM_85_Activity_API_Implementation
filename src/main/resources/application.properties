spring.application.name=activity-service

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/activity_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
